name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Setup Miniconda and create environment
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: false
        python-version: ${{ matrix.python-version }}
        activate-environment: staphscope
        environment-file: false
        channels: conda-forge,bioconda
        channel-priority: strict
        miniforge-variant: Miniforge3
        use-mamba: true

    - name: Install staphscope
      shell: bash -l {0}
      run: |
        conda install -n staphscope -c conda-forge -c bioconda staphscope -y

    - name: Test staphscope help
      shell: bash -l {0}
      run: |
        conda run -n staphscope staphscope --help
