name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
    
    - name: Install staphscope from bbeckley-hub channel
      shell: bash -l {0}
      run: |
        conda config --add channels conda-forge
        conda config --add channels bioconda
        conda config --add channels bbeckley-hub 
        conda create -n staphscope -c bbeckley-hub -c conda-forge -c bioconda staphscope python=${{ matrix.python-version }} -y
        conda activate staphscope
    
    - name: Test staphscope help
      shell: bash -l {0}
      run: |
        conda activate staphscope
        staphscope --help
