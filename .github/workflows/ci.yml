name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda (create + activate 'staphscope' env)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: ${{ matrix.python-version }}
          activate-environment: staphscope
          channels: conda-forge,bioconda
          channel-priority: strict
          use-mamba: true

      - name: Install staphscope
        shell: bash -l {0}
        run: |
          conda install -n staphscope -c conda-forge -c bioconda staphscope -y

      - name: Verify staphscope runs
        shell: bash -l {0}
        run: |
          conda run -n staphscope staphscope --help
          conda run -n staphscope staphscope --version
