{% set name = "staphscope" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: .

build:
  number: 5
  script: 
    - {{ PYTHON }} -m pip install . --no-deps -vv
    - {{ PYTHON }} scripts/post_install.py  
  entry_points:
    - staphscope = staphscope.staphscope:main
  skip: false

requirements:
  host:
    - python 
    - pip
    - setuptools
  run:
     # Core Python packages
    - pandas >=1.5.0
    - biopython >=1.80
    - psutil >=5.9.0
    - requests >=2.28.0
    - tqdm >=4.64.0
    - click >=8.0.0
    # Bioinformatics tools 
    - abricate =1.0.1
    - ncbi-amrfinderplus =3.12.8
    - perl
    - any2fasta
    - blast >=2.13.0  
    - perl-moo
    - perl-list-moreutils  
    - perl-json
    - perl-lwp-protocol-https
    - perl-path-tiny
    - perl-data-dumper
    - perl-getopt-long
    - perl-file-which

test:
  imports:
    - staphscope
    - staphscope.core
    - staphscope.modules
    - staphscope.modules.mlst_module
    - staphscope.modules.abricate_module
    - staphscope.modules.amr_module
    - staphscope.modules.spa_module
    - staphscope.modules.sccmec_module
  commands:
    - staphscope --help
    - python -c "import staphscope; print('StaphScope import successful')"

about:
  home: https://github.com/bbeckley-hub/staphscope-typing-tool
  license: MIT
  license_file: LICENSE
  summary: 'Advanced Staphylococcus aureus Typing & Lineage Analysis Platform'
  description: |
    StaphScope is a comprehensive bioinformatics tool for Staphylococcus aureus
    genomic analysis including MLST typing, spa typing, SCCmec analysis, 
    antimicrobial resistance detection, virulence factors, plasmid profiling,
    and lineage prediction from whole genome sequencing data. Designed specifically for MRSA research and
    global surveillance.
  doc_url: https://github.com/bbeckley-hub/staphscope-typing-tool
  dev_url: https://github.com/bbeckley-hub/staphscope-typing-tool

extra:
  recipe-maintainers:
    - bbeckley-hub
