name: staphscope
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.7
  - biopython>=1.79
  - pandas>=1.3.0
  - click>=8.0.0
  - blast  # BLAST tools
  - perl-json  # Perl JSON module
  - any2fasta  # Required for MLST
  - pip
  - pip:
    - -e .  # Install staphscope in development mode
