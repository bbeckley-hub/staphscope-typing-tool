{% set name = "staphscope" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv"
  entry_points:
    - staphscope = staphscope.cli:main

requirements:
  host:
    - python >=3.7
    - pip
  run:
    - python >=3.7
    - biopython >=1.79
    - pandas >=1.3.0
    - click >=8.0.0

test:
  commands:
    - staphscope --help
  imports:
    - staphscope

about:
  home: https://github.com/bbeckley-hub/staphscope-typing-tool
  license: MIT
  license_file: ../LICENSE
  summary: "Unified MLST + spa + SCCmec typing tool for Staphylococcus aureus"
  description: |
    Staphscope is a comprehensive typing tool for Staphylococcus aureus that combines
    MLST, spa typing, and SCCmec typing in a single package. It supports parallel
    processing for high-throughput analysis of bacterial genomes.
  doc_url: https://github.com/bbeckley-hub/staphscope-typing-tool
  dev_url: https://github.com/bbeckley-hub/staphscope-typing-tool

extra:
  recipe-maintainers:
    - bbeckley-hub
